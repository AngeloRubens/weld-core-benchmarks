name: JAX-RS cheaper getBeans(Class) experiment

on:
  push:
    branches: [ ci/jaxrs-resolve ]
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # <label>|<kind>|...   owb: version   release: Weld version   git: repo + commit
      VARIANTS: |
        pr3545-reqcache|git|https://github.com/AngeloRubens/core|d1fa54e24f26936e56e24c47c4da572a749435bd
        resolve-default|git|https://github.com/AngeloRubens/core|204ff4b33d702401a1fc579c045651641c39a27a
      JMH_OPTS: '-f 5 -wi 3 -w 3s -i 5 -r 3s'
      ROUNDS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Environment
        run: java -version; mvn -v; nproc; lscpu | grep 'Model name'
      - name: Build one jar per variant and check correctness
        run: |
          mkdir -p jars results
          while IFS='|' read -r label kind a b; do
            [ -z "$label" ] && continue
            case "$kind" in
              owb)
                (cd jaxrs && mvn -B -ntp -q clean package -Dowb=true -Dowb.version="$a") ;;
              release)
                (cd jaxrs && mvn -B -ntp -q clean package -Dweld.version="$a") ;;
              git)
                src=$RUNNER_TEMP/src-$label
                rm -rf "$src"; git init -q "$src"
                git -C "$src" remote add origin "$a"
                git -C "$src" fetch -q --depth 1 origin "$b"
                git -C "$src" checkout -q --detach FETCH_HEAD
                (cd "$src" && mvn -B -ntp -q install -DskipTests -Dno-format -pl environments/se/build -am)
                version=$(cd "$src" && mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
                (cd jaxrs && mvn -B -ntp -q clean package -Dweld.version="$version") ;;
            esac
            cp jaxrs/target/jaxrs.jar "jars/$label.jar"
            echo "== smoke $label"
            java -cp "jars/$label.jar" bench.jaxrs.Smoke > "results/smoke-$label.txt" 2>&1 || true
            tail -3 "results/smoke-$label.txt"
            grep -q " 0 wrong responses" "results/smoke-$label.txt" || { echo "smoke failed for $label"; head -80 "results/smoke-$label.txt"; exit 1; }
          done <<< "$VARIANTS"
      - name: JMH, rounds interleaved across variants
        run: |
          labels=$(echo "$VARIANTS" | cut -d'|' -f1 | tr '\n' ' ')
          for round in $(seq 1 $ROUNDS); do
            for label in $labels; do
              for t in 1 4; do
                echo "== round $round: $label ($t threads)"
                java -jar "jars/$label.jar" 'JaxrsBenchmark.(get|shop)' $JMH_OPTS -t $t -rf json -rff "results/$label.${t}thread.round$round.json"
              done
            done
          done
      - name: Allocation per request (-prof gc, 1 thread)
        run: |
          for label in $(echo "$VARIANTS" | cut -d'|' -f1); do
            java -jar "jars/$label.jar" 'JaxrsBenchmark.(get|shop)' -f 1 -wi 3 -w 3s -i 5 -r 3s -t 1 -prof gc | tee "results/gc-$label.txt"
          done
      - name: Summary
        if: always()
        run: |
          labels=$(echo "$VARIANTS" | cut -d'|' -f1 | tr '\n' ' ')
          {
            echo "## JAX-RS example ($(nproc) cores, $ROUNDS rounds, $JMH_OPTS), ratio to the first column"
            python3 scripts/summary.py results "$labels"
            echo; echo "## Allocation per request"; echo '```'
            for l in $labels; do echo "$l"; grep -hE '^JaxrsBenchmark\.(get|shop)(:gc\.(alloc\.rate\.norm|count|time))? ' "results/gc-$l.txt" || true; done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" > results/REPORT.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: results/
