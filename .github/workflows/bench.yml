name: Weld benchmark (patched Weld vs release)

on:
  push:
    branches: [ ci/bench ]
  workflow_dispatch:
    inputs:
      jmh:
        description: 'Run the JMH benchmarks (false = build and behaviour probe only)'
        type: boolean
        default: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: weld7
            # <label>|release|<version>   or   <label>|git|<repo>|<commit>; the first one is the baseline
            variants: |
              weld-7.0.0|release|7.0.0.Final
              pr3545|git|https://github.com/AngeloRubens/core|38f94f38cb2ea46c46913696148fc9b2fe28016c
              pr3545-reqcache|git|https://github.com/AngeloRubens/core|d1fa54e24f26936e56e24c47c4da572a749435bd
          - line: weld6
            variants: |
              weld-6.0.4|release|6.0.4.Final
              pr3546|git|https://github.com/AngeloRubens/core|9d8a605943c44a44ca2ef2654f67909f3e0102ad
              pr3546-reqcache|git|https://github.com/AngeloRubens/core|6825d96a92c5f795cc83c044bc17d02b029d0d4f
    env:
      VARIANTS: ${{ matrix.variants }}
      # the benchmarks of the Weld benchmark suite that touch proxies, interceptors and decorators
      BENCH: '.*(InterceptorBenchmark|NotInterceptedMethodBenchmark|DecoratorBenchmark|ApplicationScopedBenchmark|DependentBenchmark|ComplexBenchmark|BaselineBenchmark)\.run'
      # the ones that matter most for the single-thread view
      BENCH_1T: '.*(InterceptorBenchmark|NotInterceptedMethodBenchmark|DecoratorBenchmark|ApplicationScopedBenchmark)\.run'
      JMH_OPTS: '-f 2 -wi 3 -w 3s -i 5 -r 3s'
      ROUNDS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Environment
        run: |
          java -version; mvn -v; nproc; lscpu | grep 'Model name'
      - name: Build one benchmark jar per variant
        run: |
          mkdir -p jars results
          while IFS='|' read -r label kind a b; do
            [ -z "$label" ] && continue
            if [ "$kind" = release ]; then
              version=$a
            else
              src=$RUNNER_TEMP/src-$label
              rm -rf "$src"; git init -q "$src"
              git -C "$src" remote add origin "$a"
              git -C "$src" fetch -q --depth 1 origin "$b"
              git -C "$src" checkout -q --detach FETCH_HEAD
              git -C "$src" log -1 --format="== $label: %H %s"
              (cd "$src" && mvn -B -ntp -q install -DskipTests -Dno-format -pl environments/se/build -am)
              version=$(cd "$src" && mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
            fi
            echo "== $label uses weld $version"
            mvn -B -ntp -q clean package -DskipTests -Dversion.weld="$version"
            cp target/weld-core-benchmarks.jar "jars/$label.jar"
          done <<< "$VARIANTS"
          ls -l jars
      - name: Behaviour probe (interceptors, self-invocation, decorators, scopes)
        run: |
          mkdir -p probe-out results/probe
          first=$(ls jars/*.jar | head -1)
          javac -cp "$first" -d probe-out probe/SelfInvocationProbe.java
          base=
          while IFS='|' read -r label rest; do
            [ -z "$label" ] && continue
            java -cp "probe-out:jars/$label.jar" SelfInvocationProbe > "results/probe/$label.txt" 2> "results/probe/$label.err" || { echo "probe failed for $label"; cat "results/probe/$label.err"; exit 1; }
            [ "$(wc -l < "results/probe/$label.txt")" -ge 30 ] || { echo "probe printed too few scenarios for $label"; exit 1; }
            [ -z "$base" ] && base=$label
            if [ "$label" != "$base" ]; then
              diff -u "results/probe/$base.txt" "results/probe/$label.txt" > "results/probe/diff-$base-vs-$label.txt" && echo "$label: identical to $base" || echo "$label: DIFFERS from $base"
            fi
          done <<< "$VARIANTS"
          {
            echo "## Behaviour probe ($(wc -l < results/probe/$(echo "$VARIANTS" | head -1 | cut -d'|' -f1).txt) scenarios)"
            for f in results/probe/diff-*.txt; do
              echo; echo "### $(basename "$f" .txt)"; echo '```diff'; cat "$f"; echo '```'
              [ -s "$f" ] || echo "(no differences)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: JMH, rounds interleaved across variants
        if: ${{ inputs.jmh != false }}
        run: |
          labels=$(echo "$VARIANTS" | cut -d'|' -f1 | tr '\n' ' ')
          for round in $(seq 1 $ROUNDS); do
            for label in $labels; do
              echo "== round $round: $label (all threads)"
              java -jar "jars/$label.jar" "$BENCH" $JMH_OPTS -rf json -rff "results/$label.allthreads.round$round.json"
              echo "== round $round: $label (1 thread)"
              java -jar "jars/$label.jar" "$BENCH_1T" $JMH_OPTS -t 1 -rf json -rff "results/$label.1thread.round$round.json"
            done
          done
      - name: Summary
        if: ${{ always() && inputs.jmh != false }}
        run: |
          labels=$(echo "$VARIANTS" | cut -d'|' -f1 | tr '\n' ' ')
          { echo "## JMH ($(nproc) cores, $ROUNDS rounds, $JMH_OPTS), ratio to the first column"; python3 scripts/summary.py results "$labels"; } | tee -a "$GITHUB_STEP_SUMMARY" > results/REPORT.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.line }}
          path: results/
