name: JAX-RS example (Weld SE + RESTEasy, request scoped beans)

on:
  push:
    branches: [ ci/jaxrs ]
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: weld7
            variants: |
              main-base|git|https://github.com/AngeloRubens/core|12251dc67f721b063f2bedf5299322aac5292298
              pr3545|git|https://github.com/AngeloRubens/core|38f94f38cb2ea46c46913696148fc9b2fe28016c
              pr3545-reqcache|git|https://github.com/AngeloRubens/core|d1fa54e24f26936e56e24c47c4da572a749435bd
          - line: weld6
            variants: |
              branch-base|git|https://github.com/AngeloRubens/core|851330ce3c897ad6fb5c711f9b551ac20b39f5e3
              pr3546|git|https://github.com/AngeloRubens/core|9d8a605943c44a44ca2ef2654f67909f3e0102ad
              pr3546-reqcache|git|https://github.com/AngeloRubens/core|6825d96a92c5f795cc83c044bc17d02b029d0d4f
    env:
      VARIANTS: ${{ matrix.variants }}
      JMH_OPTS: '-f 5 -wi 3 -w 3s -i 5 -r 3s'
      ROUNDS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Environment
        run: java -version; mvn -v; nproc; lscpu | grep 'Model name'
      - name: Build one jar per variant and check correctness
        run: |
          mkdir -p jars results
          while IFS='|' read -r label kind a b; do
            [ -z "$label" ] && continue
            src=$RUNNER_TEMP/src-$label
            rm -rf "$src"; git init -q "$src"
            git -C "$src" remote add origin "$a"
            git -C "$src" fetch -q --depth 1 origin "$b"
            git -C "$src" checkout -q --detach FETCH_HEAD
            git -C "$src" log -1 --format="== $label: %H %s"
            (cd "$src" && mvn -B -ntp -q install -DskipTests -Dno-format -pl environments/se/build -am)
            version=$(cd "$src" && mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
            (cd jaxrs && mvn -B -ntp -q clean package -Dweld.version="$version")
            cp jaxrs/target/jaxrs.jar "jars/$label.jar"
            echo "== smoke $label"
            java -cp "jars/$label.jar" bench.jaxrs.Smoke 2>&1 | tail -5 | tee "results/smoke-$label.txt"
            grep -q " 0 wrong responses" "results/smoke-$label.txt" || { echo "smoke failed for $label"; exit 1; }
          done <<< "$VARIANTS"
      - name: JMH, rounds interleaved across variants
        run: |
          labels=$(echo "$VARIANTS" | cut -d'|' -f1 | tr '\n' ' ')
          for round in $(seq 1 $ROUNDS); do
            for label in $labels; do
              for t in 1 4; do
                echo "== round $round: $label ($t threads)"
                java -jar "jars/$label.jar" 'JaxrsBenchmark.get' $JMH_OPTS -t $t -rf json -rff "results/$label.${t}thread.round$round.json"
              done
            done
          done
      - name: Summary
        if: always()
        run: |
          labels=$(echo "$VARIANTS" | cut -d'|' -f1 | tr '\n' ' ')
          { echo "## JAX-RS example ($(nproc) cores, $ROUNDS rounds, $JMH_OPTS), ratio to the first column"; python3 scripts/summary.py results "$labels"; } | tee -a "$GITHUB_STEP_SUMMARY" > results/REPORT.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.line }}
          path: results/
