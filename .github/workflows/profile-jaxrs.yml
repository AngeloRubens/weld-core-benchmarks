name: Profile the JAX-RS service layer (shop)

on:
  push:
    branches: [ ci/profile-jaxrs ]
  workflow_dispatch:

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VARIANTS: |
        main-base|git|https://github.com/AngeloRubens/core|12251dc67f721b063f2bedf5299322aac5292298
        pr3545|git|https://github.com/AngeloRubens/core|38f94f38cb2ea46c46913696148fc9b2fe28016c
        pr3545-reqcache|git|https://github.com/AngeloRubens/core|d1fa54e24f26936e56e24c47c4da572a749435bd
      JMH_OPTS: '-f 1 -wi 3 -w 3s -i 5 -r 5s -t 1 -jvmArgsAppend -XX:+UnlockDiagnosticVMOptions -jvmArgsAppend -XX:+DebugNonSafepoints'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: async-profiler
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=1 kernel.kptr_restrict=0
          curl -sSL https://github.com/async-profiler/async-profiler/releases/download/v4.5/async-profiler-4.5-linux-x64.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "ASYNC_PROFILER=$(ls $RUNNER_TEMP/async-profiler-*/lib/libasyncProfiler.so)" >> "$GITHUB_ENV"
      - name: Build one jar per variant and check correctness
        run: |
          mkdir -p jars results
          while IFS='|' read -r label kind a b; do
            [ -z "$label" ] && continue
            src=$RUNNER_TEMP/src-$label
            rm -rf "$src"; git init -q "$src"
            git -C "$src" remote add origin "$a"
            git -C "$src" fetch -q --depth 1 origin "$b"
            git -C "$src" checkout -q --detach FETCH_HEAD
            (cd "$src" && mvn -B -ntp -q install -DskipTests -Dno-format -pl environments/se/build -am)
            version=$(cd "$src" && mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
            (cd jaxrs && mvn -B -ntp -q clean package -Dweld.version="$version")
            cp jaxrs/target/jaxrs.jar "jars/$label.jar"
            java -cp "jars/$label.jar" bench.jaxrs.Smoke > "results/smoke-$label.txt" 2>&1 || true
            grep -q " 0 wrong responses" "results/smoke-$label.txt" || { echo "smoke failed for $label"; head -60 "results/smoke-$label.txt"; exit 1; }
          done <<< "$VARIANTS"
      - name: Profile (gc, cpu, allocations)
        run: |
          while IFS='|' read -r label rest; do
            [ -z "$label" ] && continue
            out=results/$label; mkdir -p "$out"
            java -jar "jars/$label.jar" 'JaxrsBenchmark.shop' $JMH_OPTS -prof gc -rf json -rff "$out/gc.json" | tee "$out/gc.txt"
            java -jar "jars/$label.jar" 'JaxrsBenchmark.shop' $JMH_OPTS -prof "async:libPath=$ASYNC_PROFILER;event=cpu;output=flamegraph,collapsed;dir=$out/cpu" | tee "$out/cpu.txt"
            java -jar "jars/$label.jar" 'JaxrsBenchmark.shop' $JMH_OPTS -prof "async:libPath=$ASYNC_PROFILER;event=alloc;output=flamegraph,collapsed;dir=$out/alloc" | tee "$out/alloc.txt"
          done <<< "$VARIANTS"
      - name: Summary
        if: always()
        run: |
          {
            echo "## JAX-RS example profile"
            for d in results/*/; do
              l=$(basename "$d")
              echo; echo "### $l"
              echo '```'; grep -hE '^JaxrsBenchmark\.shop(:gc\.(alloc\.rate\.norm|count|time))? ' "$d/gc.txt" || true; echo '```'
              for kind in cpu alloc; do
                f=$(find "$d/$kind" -name '*collapsed*' | head -1)
                [ -n "$f" ] || continue
                echo; echo "#### $kind"
                python3 scripts/share.py "$f"
                python3 scripts/inclusive.py "$f"
                python3 scripts/stacks.py "$f" 25
              done
            done
          } | tee -a "$GITHUB_STEP_SUMMARY" > results/PROFILE.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profiles
          path: results/
